<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Chi tiết đơn hàng</title>
</head>
<body>

<div th:replace="~{fragments/layout :: main('Chi tiết đơn hàng - DeliveryMgr', ~{::div.content})}">
  <div class="content" id="mainContent">

    <style>
      .detail-layout { display: grid; grid-template-columns: 1fr 300px; gap: 16px; align-items: start; }

      .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 16px; }
      .panel:last-child { margin-bottom: 0; }
      .panel-hd { padding: 10px 16px; border-bottom: 1px dashed var(--border); font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--text-3); font-family: var(--mono); }
      .panel-body { padding: 16px; }

      /* Info grid */
      .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 20px; }
      .info-item { display: flex; flex-direction: column; gap: 3px; }
      .info-item.full { grid-column: 1/-1; }
      .info-label { font-size: 11px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: .4px; font-family: var(--mono); }
      .info-value { font-size: 13.5px; color: var(--text-1); font-weight: 600; line-height: 1.5; }

      /* Status badges */
      .st-badge { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; border: 1px solid; white-space: nowrap; }
      .st-NEW       { background: var(--blue-bg);   color: var(--blue);   border-color: var(--blue-bd); }
      .st-CONFIRMED { background: var(--orange-bg); color: var(--orange); border-color: var(--orange-bd); }
      .st-COMPLETED { background: var(--green-bg);  color: var(--green);  border-color: var(--green-bd); }
      .st-CANCELLED { background: var(--red-bg);    color: var(--red);    border-color: var(--red-bd); }
      .st-PAY-DONE    { background: var(--green-bg);  color: var(--green);  border-color: var(--green-bd); font-size: 11.5px; }
      .st-PAY-PENDING { background: var(--orange-bg); color: var(--orange); border-color: var(--orange-bd); font-size: 11.5px; }

      /* Product table */
      .ptable { width: 100%; border-collapse: collapse; font-size: 13px; }
      .ptable thead th { background: var(--surface-2); padding: 9px 12px; text-align: left; font-weight: 700; font-size: 11px; color: var(--text-3); font-family: var(--mono); border-bottom: 1px solid var(--border); }
      .ptable thead th.right { text-align: right; }
      .ptable tbody tr { border-bottom: 1px solid var(--border); }
      .ptable tbody tr:last-child { border-bottom: none; }
      .ptable tbody td { padding: 10px 12px; vertical-align: middle; font-size: 13px; }
      .ptable tbody td.right { text-align: right; font-weight: 600; color: var(--text-1); font-family: var(--mono); }
      .ptable tbody td.no { color: var(--text-3); font-size: 12px; }

      .summary { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
      .srow { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-2); margin-bottom: 6px; }
      .srow span:last-child { font-weight: 600; color: var(--text-1); }
      .stotal { display: flex; justify-content: space-between; font-size: 16px; font-weight: 800; color: var(--text-1); border-top: 1.5px solid var(--border-strong); padding-top: 10px; margin-top: 6px; font-family: var(--mono); }

      /* Timeline */
      .timeline { display: flex; flex-direction: column; gap: 0; padding: 4px 0; }
      .tl-item { display: flex; gap: 12px; position: relative; }
      .tl-item:not(:last-child) .tl-line { position: absolute; left: 9px; top: 22px; width: 2px; height: calc(100% + 2px); background: var(--border); z-index: 0; }
      .tl-item.done:not(:last-child) .tl-line { background: var(--text-1); }
      .tl-dot-wrap { position: relative; z-index: 1; flex-shrink: 0; width: 20px; display: flex; justify-content: center; padding-top: 2px; }
      .tl-dot { width: 14px; height: 14px; border-radius: 50%; border: 2.5px solid var(--border-strong); background: var(--surface); flex-shrink: 0; }
      .tl-dot.done   { background: var(--text-1); border-color: var(--text-1); }
      .tl-dot.active { background: var(--surface); border-color: var(--accent); box-shadow: 0 0 0 3px rgba(47,91,232,.15); }
      .tl-content { padding-bottom: 18px; flex: 1; }
      .tl-title { font-size: 13px; font-weight: 700; color: var(--text-2); margin-bottom: 2px; }
      .tl-title.active  { color: var(--accent); }
      .tl-title.pending { color: var(--text-4); }
      .tl-time { font-size: 11.5px; color: var(--text-3); }

      /* Shipper card */
      .shipper-card { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
      .shipper-avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--accent-light); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; color: var(--accent); flex-shrink: 0; }
      .shipper-name  { font-size: 13.5px; font-weight: 700; color: var(--text-1); }
      .shipper-phone { font-size: 12.5px; color: var(--text-3); margin-top: 1px; }
      .shipper-vehicle { font-size: 12px; color: var(--text-3); margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }

      /* Status update section */
      .update-sep { margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--border); }
      .update-sep .sec-title { margin-bottom: 8px; }
      .fg select { width: 100%; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); padding: 8px 10px; font-family: var(--font); font-size: 13.5px; color: var(--text-1); background: var(--surface); outline: none; transition: border-color .15s; margin-bottom: 10px; }
      .fg select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(47,91,232,.10); }
      .btn-block { width: 100%; justify-content: center; padding: 9px; }

      /* Delete modal */
      .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 500; display: none; align-items: center; justify-content: center; }
      .overlay.show { display: flex; }
      .modal { background: var(--surface); border-radius: var(--radius-lg); padding: 28px; max-width: 380px; width: 90%; box-shadow: var(--shadow-md); }
      .modal h3 { font-size: 16px; font-weight: 800; color: var(--text-1); margin-bottom: 8px; }
      .modal p  { font-size: 13.5px; color: var(--text-2); margin-bottom: 22px; line-height: 1.6; }
      .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }

      /* State box */
      .state-box { text-align: center; padding: 60px 20px; color: var(--text-3); }

      .spin { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .6s linear infinite; display: none; }
      @keyframes spin { to { transform: rotate(360deg); } }

      @media (max-width: 860px) { .detail-layout { grid-template-columns: 1fr; } .info-grid { grid-template-columns: 1fr; } }
    </style>

    <!-- Delete modal -->
    <div class="overlay" id="delOverlay">
      <div class="modal">
        <h3>Xác nhận xoá đơn hàng</h3>
        <p id="delMsg">Bạn có chắc muốn xoá đơn hàng này? Hành động này không thể hoàn tác.</p>
        <div class="modal-actions">
          <button class="btn btn-default" onclick="closeDelModal()">Huỷ bỏ</button>
          <button class="btn btn-danger" onclick="confirmDelete()">Xoá đơn</button>
        </div>
      </div>
    </div>

    <!-- Content rendered by JS -->
    <div id="pageWrap">
      <div class="state-box">
        <p style="font-size:14px;color:var(--text-3)">Đang tải dữ liệu...</p>
      </div>
    </div>

    <script>
      const API_BASE = '';

      function getOrderId() {
        const parts = window.location.pathname.split('/').filter(Boolean);
        const idx   = parts.indexOf('orders');
        if (idx !== -1 && parts[idx+1]) return parts[idx+1];
        return new URLSearchParams(window.location.search).get('id');
      }
      const ORDER_ID = getOrderId();

      const STATUS_MAP = {
        NEW:       { label:'Chờ xử lý',  cls:'st-NEW',       step:0 },
        CONFIRMED: { label:'Đang giao',  cls:'st-CONFIRMED',  step:1 },
        COMPLETED: { label:'Thành công', cls:'st-COMPLETED',  step:2 },
        CANCELLED: { label:'Đã huỷ',     cls:'st-CANCELLED',  step:-1 },
      };
      const TIMELINE_STEPS = [
        { key:'NEW',       label:'Đơn hàng tạo'   },
        { key:'CONFIRMED', label:'Đang giao hàng' },
        { key:'COMPLETED', label:'Giao thành công'},
      ];
      let orderData = null;

      async function loadOrder() {
        if (!ORDER_ID) { renderError('Không tìm thấy ID đơn hàng trong URL.'); return; }
        try {
          const res  = await fetch(API_BASE + '/api/orders/' + ORDER_ID);
          if (!res.ok) throw new Error();
          const data = await res.json();
          if (data.message) throw new Error(data.message);
          orderData = data;
          renderPage(data);
        } catch { renderError('Không tìm thấy đơn hàng ID: ' + ORDER_ID); }
      }

      function renderPage(o) {
        const st      = STATUS_MAP[o.status] || { label:o.status, cls:'st-NEW', step:0 };
        const curStep = st.step;
        const details = Array.isArray(o.orderDetails) ? o.orderDetails : [];
        let sub = 0; details.forEach(d => sub += (d.quantity||0)*(d.price||0));
        const ship = o.shippingFee||0, disc = o.discount||0;
        const total = o.totalAmount != null ? o.totalAmount : sub + ship - disc;
        const shipperName  = o.shipperName || o.delivery?.shipperName || '';
        const shipperPhone = o.delivery?.shipperPhone || '';
        const vehicle      = o.delivery?.vehicleInfo  || '';
        const initials     = shipperName ? shipperName.split(' ').map(w=>w[0]).slice(-2).join('').toUpperCase() : '';
        const orderDate    = o.orderDate ? fmtDateTime(o.orderDate) : '—';
        const isPaid       = o.paymentStatus==='Đã thanh toán'||o.paymentStatus==='PAID';

        document.getElementById('pageWrap').innerHTML = `
  <div class="bc">
    <a href="/orders">Đơn hàng</a><span class="bc-sep">/</span><span>DH-${o.id}</span>
  </div>

  <div class="page-hd">
    <div>
      <div class="page-eyebrow">ĐƠN HÀNG</div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <h1 class="page-title">Chi tiết đơn hàng #DH-${o.id}</h1>
        <span class="st-badge ${st.cls}">${st.label}</span>
      </div>
    </div>
    <div class="page-actions">
      <a href="/orders/${o.id}/edit" class="btn btn-default">✏ Chỉnh sửa</a>
      <button class="btn btn-danger" onclick="openDelModal(${o.id})">Xoá đơn</button>
      <button class="btn btn-default" onclick="window.print()">🖨 In phiếu</button>
    </div>
  </div>

  <div class="detail-layout">

    <div>
      <div class="panel">
        <div class="panel-hd">Thông tin khách hàng</div>
        <div class="panel-body">
          <div class="info-grid">
            <div class="info-item"><span class="info-label">Họ tên</span><span class="info-value">${esc(o.customerName||'—')}</span></div>
            <div class="info-item"><span class="info-label">Số điện thoại</span><span class="info-value">${esc(o.phone||'—')}</span></div>
            <div class="info-item"><span class="info-label">Email</span><span class="info-value">${esc(o.email||'—')}</span></div>
            <div class="info-item"><span class="info-label">Ngày tạo đơn</span><span class="info-value">${orderDate}</span></div>
            <div class="info-item full"><span class="info-label">Địa chỉ giao hàng</span><span class="info-value">${esc(o.address||'—')}</span></div>
            ${o.deliveryNote ? `<div class="info-item full"><span class="info-label">Ghi chú</span><span class="info-value" style="color:var(--text-2);font-weight:500">${esc(o.deliveryNote)}</span></div>` : ''}
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-hd">Sản phẩm trong đơn</div>
        <div class="panel-body">
          <div style="overflow-x:auto">
            <table class="ptable">
              <thead><tr><th style="width:36px">#</th><th>Tên sản phẩm</th><th class="right" style="width:80px">SL</th><th class="right" style="width:110px">Đơn giá</th><th class="right" style="width:120px">Thành tiền</th></tr></thead>
              <tbody>
                ${!details.length ? `<tr><td colspan="5" style="text-align:center;color:var(--text-3);padding:20px">Không có sản phẩm</td></tr>`
                : details.map((d,i)=>`<tr><td class="no">${i+1}</td><td>${esc(d.productName||'—')}</td><td class="right">${d.quantity||0}</td><td class="right">${fmtVND(d.price||0)}</td><td class="right">${fmtVND((d.quantity||0)*(d.price||0))}</td></tr>`).join('')}
              </tbody>
            </table>
          </div>
          <div class="summary">
            <div class="srow"><span>Tạm tính:</span><span>${fmtVND(sub)}</span></div>
            <div class="srow"><span>Phí giao:</span><span>${fmtVND(ship)}</span></div>
            <div class="srow"><span>Giảm giá:</span><span>- ${fmtVND(disc)}</span></div>
            <div class="stotal"><span>Tổng cộng:</span><span>${fmtVND(total)}</span></div>
          </div>
        </div>
      </div>
    </div>

    <div>
      <div class="panel">
        <div class="panel-hd">Trạng thái giao hàng</div>
        <div class="panel-body">
          <div class="timeline">
            ${TIMELINE_STEPS.map((step,i) => {
          const isDone=curStep>i, isActive=curStep===i, isPend=curStep<i;
          return `<div class="tl-item ${isDone?'done':''}">
                <div class="tl-dot-wrap"><div class="tl-line"></div><div class="tl-dot ${isDone?'done':isActive?'active':''}"></div></div>
                <div class="tl-content">
                  <div class="tl-title ${isActive?'active':isPend?'pending':''}">${step.label}</div>
                  <div class="tl-time">${isDone||isActive?(i===0?orderDate:'Đã cập nhật'):'—'}</div>
                </div>
              </div>`;
        }).join('')}
          </div>
          <div class="update-sep">
            <div class="sec-title">Cập nhật trạng thái</div>
            <div class="fg">
              <select id="newStatus">
                <option value="">Chọn trạng thái mới ▾</option>
                <option value="NEW"       ${o.status==='NEW'       ?'selected':''}>Chờ xử lý</option>
                <option value="CONFIRMED" ${o.status==='CONFIRMED' ?'selected':''}>Đang giao</option>
                <option value="COMPLETED" ${o.status==='COMPLETED' ?'selected':''}>Giao thành công</option>
                <option value="CANCELLED" ${o.status==='CANCELLED' ?'selected':''}>Huỷ đơn</option>
              </select>
            </div>
            <button class="btn btn-primary btn-block" id="updateStatusBtn" onclick="updateStatus()">
              <div class="spin" id="statusSpin"></div>
              Cập nhật
            </button>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-hd">Tài xế giao hàng</div>
        <div class="panel-body">
          ${shipperName ? `
          <div class="shipper-card">
            <div class="shipper-avatar">${initials||'?'}</div>
            <div>
              <div class="shipper-name">${esc(shipperName)}</div>
              <div class="shipper-phone">SĐT: ${esc(shipperPhone||'Chưa có')}</div>
            </div>
          </div>
          ${vehicle ? `<div class="shipper-vehicle">🚗 ${esc(vehicle)}</div>` : ''}
          ` : `<div style="text-align:center;padding:10px 0;color:var(--text-3);font-size:13px">Chưa phân công tài xế</div>`}
          <button class="btn btn-default btn-block" style="margin-top:12px" onclick="showToast('Tính năng đổi tài xế sẽ được cập nhật sau','success')">
            ${shipperName ? '↔ Đổi tài xế' : '+ Phân công tài xế'}
          </button>
        </div>
      </div>

      <div class="panel">
        <div class="panel-hd">Thanh toán</div>
        <div class="panel-body">
          <div class="info-grid" style="grid-template-columns:1fr">
            <div class="info-item"><span class="info-label">Hình thức</span><span class="info-value">${esc(o.paymentMethod||'Chưa chọn')}</span></div>
            <div class="info-item" style="flex-direction:row;align-items:center;gap:8px">
              <span class="info-label" style="text-transform:none;letter-spacing:0;font-size:13px">Trạng thái:</span>
              <span class="st-badge ${isPaid?'st-PAY-DONE':'st-PAY-PENDING'}">${isPaid?'Đã thanh toán':esc(o.paymentStatus||'Chưa thu')}</span>
            </div>
            ${o.expectedTime ? `<div class="info-item"><span class="info-label">Giao dự kiến</span><span class="info-value">${esc(o.expectedTime)}</span></div>` : ''}
          </div>
        </div>
      </div>
    </div>

  </div>`;
      }

      async function updateStatus() {
        const newStatus = document.getElementById('newStatus')?.value;
        if (!newStatus) { showToast('Vui lòng chọn trạng thái mới!','error'); return; }
        if (newStatus === orderData?.status) { showToast('Đơn hàng đã ở trạng thái này rồi!','error'); return; }
        setStatusLoading(true);
        try {
          const res  = await fetch(API_BASE+'/api/orders/'+ORDER_ID, {method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({...orderData,status:newStatus})});
          const data = await res.json().catch(()=>({}));
          if (res.ok) { showToast('Cập nhật trạng thái thành công!','success'); orderData=data; renderPage(data); }
          else showToast(data.message||'Cập nhật thất bại!','error');
        } catch { showToast('Không kết nối được server!','error'); }
        finally { setStatusLoading(false); }
      }
      function setStatusLoading(on) {
        const btn = document.getElementById('updateStatusBtn'); if(!btn) return;
        btn.disabled=on; document.getElementById('statusSpin').style.display=on?'block':'none';
      }

      function openDelModal(id) { document.getElementById('delMsg').textContent=`Bạn có chắc muốn xoá đơn hàng DH-${id}? Hành động này không thể hoàn tác.`; document.getElementById('delOverlay').classList.add('show'); }
      function closeDelModal() { document.getElementById('delOverlay').classList.remove('show'); }
      async function confirmDelete() {
        closeDelModal();
        try {
          const res = await fetch(API_BASE+'/api/orders/'+ORDER_ID,{method:'DELETE'});
          if (res.ok) { showToast('Đã xoá đơn hàng!','success'); setTimeout(()=>window.location.href='/orders',1500); }
          else showToast('Xoá thất bại!','error');
        } catch { showToast('Không kết nối được server!','error'); }
      }

      function renderError(msg) {
        document.getElementById('pageWrap').innerHTML=`<div class="state-box"><p style="color:var(--red);font-size:14px;font-weight:600">${msg}</p><a href="/orders" class="btn btn-default" style="margin-top:16px;display:inline-flex">← Quay lại danh sách</a></div>`;
      }
      function fmtVND(n) { return new Intl.NumberFormat('vi-VN').format(n||0)+'đ'; }
      function fmtDateTime(s) { try { const d=new Date(s); return d.toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+d.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'}); } catch { return s; } }
      function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

      document.getElementById('delOverlay').addEventListener('click', function(e){ if(e.target===this) closeDelModal(); });
      loadOrder();
    </script>

  </div>
</div>

</body>
</html>
